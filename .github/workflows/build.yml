name: build

on:
  push:
    branches: [master]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true

      # NSIS makes the installer; the runners normally have it, this is the
      # fallback when an image stops shipping it.
      - name: Ensure NSIS
        run: |
          if (-not (Test-Path "C:\Program Files (x86)\NSIS\makensis.exe")) {
            choco install nsis -y --no-progress
          }
        shell: pwsh

      # The player, its installer and the portable zip. This also copies the
      # FFmpeg build from third_party where cgo expects it.
      - name: Build
        run: powershell -NoProfile -File packaging\build.ps1

      - name: Test
        run: |
          $env:PATH = "$PWD;$env:PATH"
          go vet ./...
          go test ./...
        shell: pwsh

      - uses: actions/upload-artifact@v4
        with:
          name: cupbox-windows
          path: |
            cupbox.exe
            dist/Cupbox-Setup-*.exe
            dist/Cupbox-*-portable.zip
          if-no-files-found: error

      # A v* tag publishes what it built, so a release always matches a commit.
      # gh expands the paths itself: the pattern engine inside the release
      # actions does not match a wildcard here.
      - name: Release
        if: startsWith(github.ref, 'refs/tags/v')
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $files = Get-ChildItem "dist" -File | Where-Object { ($_.Name -like "Cupbox-Setup-*.exe") -or ($_.Name -like "Cupbox-*-portable.zip") }
          $files | ForEach-Object { Write-Host "attaching $($_.Name) ($($_.Length) bytes)" }
          gh release create $env:GITHUB_REF_NAME --generate-notes --verify-tag $files.FullName
