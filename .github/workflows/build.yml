name: build

on:
  push:
    branches: [master]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true

      # NSIS makes the installer; the runners normally have it, this is the
      # fallback when an image stops shipping it.
      - name: Ensure NSIS
        run: |
          if (-not (Test-Path "C:\Program Files (x86)\NSIS\makensis.exe")) {
            choco install nsis -y --no-progress
          }
        shell: pwsh

      # The player, its installer and the portable zip. This also copies the
      # FFmpeg build from third_party where cgo expects it.
      - name: Build
        run: powershell -NoProfile -File packaging\build.ps1

      - name: Test
        run: |
          $env:PATH = "$PWD;$env:PATH"
          go vet ./...
          go test ./...
        shell: pwsh

      - uses: actions/upload-artifact@v4
        with:
          name: cupbox-windows
          path: |
            cupbox.exe
            dist/Cupbox-Setup-*.exe
            dist/Cupbox-0.1.0-portable.zip
          if-no-files-found: error

      # A v* tag publishes what it built, so a release always matches a commit.
      - name: Release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: |
            dist/Cupbox-Setup-*.exe
            dist/Cupbox-0.1.0-portable.zip
          generate_release_notes: true
